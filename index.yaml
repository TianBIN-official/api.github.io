# 天彬TianBIN.org网络代理
name: 天彬TianBIN.org网络代理
mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: warning
external-controller: '127.0.0.1:9090'
unified-delay: true
global-client-fingerprint: chrome
keep-alive-interval: 360
dns:
  enable: true
  ipv6: false
  default-nameserver: [223.5.5.5, 119.29.29.29, 114.114.114.114]
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  proxy-server-nameserver: [223.5.5.5, 119.29.29.29, 114.114.114.114]
  nameserver: [223.5.5.5, 119.29.29.29, 114.114.114.114]
  fallback: [1.1.1.1, 8.8.8.8]
  fallback-filter: 
    geoip: true
    geoip-code: CN
    geosite: [gfw]
    ipcidr: [240.0.0.0/4]
    domain: [+.google.com, +.microsoft.com, +.googleapis.com, +.googlevideo.com, +.youtube.com, +.ytimg.com, +.github.com, +.github.io, +.githubusercontent.com, +.facebook.com, +.fbsbx.com, +.live.com, +.instagram.com, +.telegram.org, +.tiktokv.com, +.twitter.com, +.x.com, +.pixiv.net, +.cdninstagram.com, +.tiktokcdn.com, +.twimg.com, +.t.me, +.pximg.net]
